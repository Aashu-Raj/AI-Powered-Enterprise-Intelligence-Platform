# alembic.ini — Alembic migration configuration
# Run: alembic revision --autogenerate -m "description"
# Run: alembic upgrade head

[alembic]
# path to migration scripts
script_location = database/migrations

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path entry for finding model imports
prepend_sys_path = .

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# format of version file names
# version_num_format is applied to version ids before creating the path
# leave empty for default format (which is the revision id)
# version_num_format = %%(rev)s

[post_write_hooks]
# do not use post-write hooks in this project

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
